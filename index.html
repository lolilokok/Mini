<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Business Archive — Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #0b1120);
      --bg-card: var(--tg-theme-secondary-bg-color, #131c31);
      --border: rgba(148, 163, 184, 0.18);
      --text: var(--tg-theme-text-color, #e2e8f0);
      --muted: var(--tg-theme-hint-color, #94a3b8);
      --accent: var(--tg-theme-button-color, #38bdf8);
      --accent-text: var(--tg-theme-button-text-color, #082f49);
      --out-bg: #172554;
      --out-border: rgba(59, 130, 246, 0.35);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .layout {
      max-width: 980px;
      margin: 0 auto;
      padding: 14px 14px 60px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .topbar {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: sticky;
      top: 8px;
      z-index: 10;
      backdrop-filter: blur(8px);
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .title-row h1 {
      margin: 0;
      font-size: 17px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .btn {
      border: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.55);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: 0.15s ease;
    }

    .btn:hover { border-color: var(--accent); }
    .btn.disabled { opacity: 0.45; pointer-events: none; }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    @media (max-width: 640px) {
      .controls { grid-template-columns: 1fr; }
    }

    select, input[type="search"] {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.55);
      color: var(--text);
      font-size: 14px;
      outline: none;
    }

    select:focus, input[type="search"]:focus { border-color: var(--accent); }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .chip {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      padding: 6px 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s ease;
    }

    .chip.active {
      background: var(--accent);
      color: var(--accent-text);
      border-color: transparent;
    }

    .stats-bar {
      font-size: 12px;
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .messages {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg {
      max-width: 85%;
      padding: 11px 14px;
      border-radius: 14px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      align-self: flex-start;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.14);
    }

    .msg.out {
      align-self: flex-end;
      background: var(--out-bg);
      border-color: var(--out-border);
    }

    .msg-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;
      margin-bottom: 6px;
      font-size: 12px;
    }

    .sender { font-weight: 700; color: #38bdf8; }
    .msg.out .sender { color: #93c5fd; }
    .time { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }

    .badge {
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }
    .b-once { background: rgba(249, 115, 22, 0.22); color: #fdba74; }
    .b-del { background: rgba(239, 68, 68, 0.22); color: #fca5a5; }
    .b-edit { background: rgba(234, 179, 8, 0.22); color: #fde047; }
    .b-spoiler { background: rgba(168, 85, 247, 0.22); color: #d8b4fe; }
    .b-ok { background: rgba(34, 197, 94, 0.22); color: #86efac; }

    .media-box { margin: 6px 0; }
    .media-box img {
      max-width: 100%;
      max-height: 360px;
      border-radius: 10px;
      display: block;
      cursor: zoom-in;
    }
    .media-box video {
      max-width: 100%;
      max-height: 360px;
      border-radius: 10px;
      display: block;
    }
    .media-box video.round {
      width: 220px;
      height: 220px;
      object-fit: cover;
      border-radius: 50%;
      border: 2px solid rgba(56, 189, 248, 0.45);
    }
    .media-box audio { width: 260px; max-width: 100%; }

    .media-tag {
      display: inline-block;
      font-size: 12px;
      padding: 4px 9px;
      border-radius: 8px;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid var(--border);
      color: var(--muted);
      margin-bottom: 4px;
    }

    .text {
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 14px;
      line-height: 1.45;
    }

    .old-text {
      font-size: 13px;
      color: #fca5a5;
      padding-bottom: 6px;
      margin-bottom: 6px;
      border-bottom: 1px dashed rgba(148, 163, 184, 0.3);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 40px 16px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      font-size: 14px;
    }

    a.dl-link {
      color: var(--accent);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
    }

    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.9);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
      cursor: zoom-out;
    }
    .lightbox.open { display: flex; }
    .lightbox img {
      max-width: 100%;
      max-height: 92vh;
      border-radius: 12px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>
  <div class="layout">
    <div class="topbar">
      <div class="title-row">
        <h1>🛡 Архив бизнес-чатов</h1>
        <div class="actions">
          <span id="statusPill" class="badge b-spoiler">Загрузка…</span>
          <button id="refreshBtn" class="btn" type="button" title="Обновить">🔄</button>
          <a id="exportHtmlBtn" class="btn disabled" href="#">🌐 HTML</a>
          <a id="exportTxtBtn" class="btn disabled" href="#">📄 TXT</a>
        </div>
      </div>
      <div class="controls">
        <select id="chatSelect" aria-label="Выбор диалога">
          <option value="">Загрузка диалогов…</option>
        </select>
        <input id="searchInput" type="search" placeholder="Поиск по тексту или имени…">
      </div>
      <div class="filters">
        <button class="chip active" data-filter="all">Все</button>
        <button class="chip" data-filter="once">🔥 1-View</button>
        <button class="chip" data-filter="deleted">🗑 Удалённые</button>
        <button class="chip" data-filter="edited">✏️ Изменённые</button>
        <button class="chip" data-filter="media">🎞 Медиа</button>
      </div>
      <div id="statsBar" class="stats-bar"></div>
    </div>

    <div id="messages" class="messages">
      <div class="empty">Выберите диалог для просмотра переписки.</div>
    </div>
  </div>

  <div id="lightbox" class="lightbox" title="Нажмите, чтобы закрыть">
    <img id="lightboxImg" src="" alt="Просмотр">
  </div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const params = new URLSearchParams(window.location.search);
    let accessToken = params.get("token") || "";
    const initialChatId = params.get("chat_id") || "";
    const initData = tg ? tg.initData || "" : "";

    const chatSelect = document.getElementById("chatSelect");
    const searchInput = document.getElementById("searchInput");
    const messagesBox = document.getElementById("messages");
    const statsBar = document.getElementById("statsBar");
    const statusPill = document.getElementById("statusPill");
    const refreshBtn = document.getElementById("refreshBtn");
    const exportHtmlBtn = document.getElementById("exportHtmlBtn");
    const exportTxtBtn = document.getElementById("exportTxtBtn");
    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightboxImg");

    let allMessages = [];
    let activeFilter = "all";

    const TYPE_LABELS = {
      photo: "🖼 Фото",
      video: "🎬 Видео",
      video_note: "⏺ Кружок",
      voice: "🎤 Голосовое",
      animation: "🎞 GIF",
      audio: "🎵 Аудио",
      document: "📎 Документ",
      sticker: "🎭 Стикер",
      text: "💬 Текст",
    };

    function fmtTime(ts) {
      if (!ts) return "";
      return new Date(ts * 1000).toLocaleString("ru-RU", {
        day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit"
      });
    }

    function fmtDuration(sec) {
      if (!sec) return "";
      const m = Math.floor(sec / 60);
      const s = String(sec % 60).padStart(2, "0");
      return ` · ${m}:${s}`;
    }

    function updateExportLinks(chatId) {
      if (!chatId || !accessToken) {
        exportHtmlBtn.classList.add("disabled");
        exportTxtBtn.classList.add("disabled");
        exportHtmlBtn.href = "#";
        exportTxtBtn.href = "#";
        return;
      }
      exportHtmlBtn.classList.remove("disabled");
      exportTxtBtn.classList.remove("disabled");
      exportHtmlBtn.href = `/api/export/${encodeURIComponent(chatId)}?fmt=html&token=${encodeURIComponent(accessToken)}`;
      exportTxtBtn.href = `/api/export/${encodeURIComponent(chatId)}?fmt=txt&token=${encodeURIComponent(accessToken)}`;
    }

    async function apiPost(url, extra = {}) {
      const form = new URLSearchParams();
      if (initData) form.set("_auth", initData);
      if (accessToken) form.set("token", accessToken);
      for (const [k, v] of Object.entries(extra)) {
        if (v !== undefined && v !== null && v !== "") form.set(k, String(v));
      }
      const res = await fetch(url, { method: "POST", body: form });
      if (!res.ok) {
        const err = await res.json().catch(() => ({ error: res.statusText }));
        throw new Error(err.error || `HTTP ${res.status}`);
      }
      return res.json();
    }

    function renderMedia(m) {
      if (!m.content_type || m.content_type === "text") return null;
      const label = (TYPE_LABELS[m.content_type] || m.content_type) + fmtDuration(m.duration);
      const box = document.createElement("div");
      box.className = "media-box";

      if (!m.media_url) {
        const pill = document.createElement("div");
        pill.className = "media-tag";
        pill.textContent = `${label} (без локальной копии)`;
        box.appendChild(pill);
        return box;
      }

      if (m.content_type === "photo" || m.content_type === "sticker") {
        const img = document.createElement("img");
        img.src = m.media_url;
        img.loading = "lazy";
        img.alt = label;
        img.addEventListener("click", () => {
          lightboxImg.src = m.media_url;
          lightbox.classList.add("open");
        });
        box.appendChild(img);
      } else if (m.content_type === "video" || m.content_type === "video_note" || m.content_type === "animation") {
        if (m.content_type === "video_note") {
          const tag = document.createElement("div");
          tag.className = "media-tag";
          tag.textContent = label;
          box.appendChild(tag);
        }
        const vid = document.createElement("video");
        vid.src = m.media_url;
        vid.controls = true;
        vid.playsInline = true;
        if (m.content_type === "video_note") vid.className = "round";
        if (m.content_type === "animation") {
          vid.loop = true;
          vid.muted = true;
        }
        box.appendChild(vid);
      } else if (m.content_type === "voice" || m.content_type === "audio") {
        const tag = document.createElement("div");
        tag.className = "media-tag";
        tag.textContent = label;
        box.appendChild(tag);
        const aud = document.createElement("audio");
        aud.src = m.media_url;
        aud.controls = true;
        box.appendChild(aud);
      } else {
        const link = document.createElement("a");
        link.href = m.media_url;
        link.target = "_blank";
        link.className = "dl-link";
        link.textContent = `📥 Скачать ${label}`;
        box.appendChild(link);
      }
      return box;
    }

    function renderMessages() {
      const q = searchInput.value.trim().toLowerCase();
      const filtered = allMessages.filter((m) => {
        if (activeFilter === "once" && !m.is_view_once) return false;
        if (activeFilter === "deleted" && !m.is_deleted) return false;
        if (activeFilter === "edited" && !m.is_edited) return false;
        if (activeFilter === "media" && (!m.content_type || m.content_type === "text")) return false;
        if (q) {
          const hay = [m.text, m.caption, m.prev_text, m.sender_name].filter(Boolean).join(" ").toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });

      const onceCnt = allMessages.filter((m) => m.is_view_once).length;
      const delCnt = allMessages.filter((m) => m.is_deleted).length;
      const editCnt = allMessages.filter((m) => m.is_edited).length;
      statsBar.innerHTML =
        `<span>Всего: <b>${allMessages.length}</b></span>` +
        `<span>Показано: <b>${filtered.length}</b></span>` +
        `<span>1-View: <b>${onceCnt}</b></span>` +
        `<span>Удалено: <b>${delCnt}</b></span>` +
        `<span>Изменено: <b>${editCnt}</b></span>`;

      messagesBox.innerHTML = "";
      if (!filtered.length) {
        messagesBox.innerHTML = '<div class="empty">Нет сообщений по выбранному фильтру.</div>';
        return;
      }

      for (const m of filtered) {
        const card = document.createElement("div");
        card.className = `msg ${m.is_outgoing ? "out" : "in"}`;

        const head = document.createElement("div");
        head.className = "msg-head";

        const sender = document.createElement("span");
        sender.className = "sender";
        sender.textContent = m.sender_name || (m.is_outgoing ? "Вы" : "Собеседник");
        head.appendChild(sender);

        if (m.is_view_once) {
          const b = document.createElement("span");
          b.className = "badge b-once";
          b.textContent = "🔥 1-View";
          head.appendChild(b);
        }
        if (m.has_spoiler) {
          const b = document.createElement("span");
          b.className = "badge b-spoiler";
          b.textContent = "✨ Спойлер";
          head.appendChild(b);
        }
        if (m.is_edited) {
          const b = document.createElement("span");
          b.className = "badge b-edit";
          b.textContent = "✏️ Изменено";
          head.appendChild(b);
        }
        if (m.is_deleted) {
          const b = document.createElement("span");
          b.className = "badge b-del";
          b.textContent = "🗑 Удалено";
          head.appendChild(b);
        }

        const tm = document.createElement("span");
        tm.className = "time";
        tm.textContent = fmtTime(m.date_ts);
        head.appendChild(tm);
        card.appendChild(head);

        const mediaNode = renderMedia(m);
        if (mediaNode) card.appendChild(mediaNode);

        if (m.is_edited && m.prev_text) {
          const oldDiv = document.createElement("div");
          oldDiv.className = "old-text";
          oldDiv.textContent = `Было: ${m.prev_text}`;
          card.appendChild(oldDiv);
        }

        const txt = m.text || m.caption;
        if (txt) {
          const txtDiv = document.createElement("div");
          txtDiv.className = "text";
          txtDiv.textContent = txt;
          card.appendChild(txtDiv);
        }

        messagesBox.appendChild(card);
      }
    }

    async function loadHistory(chatId) {
      updateExportLinks(chatId);
      if (!chatId) return;
      messagesBox.innerHTML = '<div class="empty">Загрузка сообщений…</div>';
      try {
        const data = await apiPost(`/api/history?chat_id=${encodeURIComponent(chatId)}`);
        if (data.token) accessToken = data.token;
        allMessages = Array.isArray(data) ? data : (data.messages || []);
        updateExportLinks(chatId);
        statusPill.textContent = "Подключено";
        statusPill.className = "badge b-ok";
        renderMessages();
        window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
      } catch (err) {
        statusPill.textContent = "Ошибка";
        statusPill.className = "badge b-del";
        messagesBox.innerHTML = `<div class="empty">Ошибка загрузки: ${err.message}</div>`;
      }
    }

    async function init() {
      if (!initData && !accessToken) {
        statusPill.textContent = "Нет подписи";
        chatSelect.innerHTML = '<option value="">Откройте через кнопку в боте</option>';
        messagesBox.innerHTML = '<div class="empty">Откройте этот Mini App через кнопку «📱 Mini App» или «📂 Архив и экспорт» внутри вашего Telegram-бота.</div>';
        return;
      }

      try {
        const data = await apiPost("/api/chats");
        if (data.token) accessToken = data.token;
        const chats = Array.isArray(data) ? data : (data.chats || []);
        chatSelect.innerHTML = "";
        if (!chats.length) {
          chatSelect.innerHTML = '<option value="">Нет сохранённых диалогов</option>';
          messagesBox.innerHTML = '<div class="empty">Архив пока пуст.</div>';
          statusPill.textContent = "Пусто";
          updateExportLinks("");
          return;
        }
        for (const c of chats) {
          const opt = document.createElement("option");
          opt.value = String(c.chat_id);
          opt.textContent = `${c.chat_title || c.chat_id} (${c.total_count})`;
          chatSelect.appendChild(opt);
        }
        if (initialChatId && chats.some((c) => String(c.chat_id) === initialChatId)) {
          chatSelect.value = initialChatId;
        }
        await loadHistory(chatSelect.value);
      } catch (err) {
        statusPill.textContent = "Ошибка";
        statusPill.className = "badge b-del";
        messagesBox.innerHTML = `<div class="empty">Не удалось загрузить диалоги: ${err.message}</div>`;
      }
    }

    chatSelect.addEventListener("change", () => loadHistory(chatSelect.value));
    refreshBtn.addEventListener("click", () => loadHistory(chatSelect.value));
    searchInput.addEventListener("input", renderMessages);
    lightbox.addEventListener("click", () => lightbox.classList.remove("open"));
    document.querySelectorAll(".chip").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".chip").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        activeFilter = btn.dataset.filter;
        renderMessages();
      });
    });

    init();
  </script>
</body>
</html>
